[tool.ruff]
line-length = 100
target-version = "py312"
# `*.md` because ruff 0.16 started formatting the Python inside Markdown code
# blocks, and this repo's Markdown is explanation: CLAUDE.md files, DESIGN.md and
# the skills under `.claude/`, full of snippets that exist to be *read* — several
# of them deliberately wrong, since that is what a bad→good pair is. Letting the
# formatter own the documentation is a policy worth choosing on purpose; it
# arrived instead as a side effect of a patch-level bump, turning CI red on two
# skill files. Delete this pattern if we ever decide we want it.
extend-exclude = ["**/migrations/**", "*.md"]

[tool.ruff.lint]
# E/W (pycodestyle) + F (pyflakes) cover what flake8 enforced; I adds isort.
select = ["E", "F", "I", "W"]
ignore = ["E203"]  # whitespace before ':' — conflicts with the formatter's slicing style

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"core/management/commands/seed_data/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "config"]

[tool.coverage.run]
source = ["core"]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
# The backend ratchet, and the number a bare `pytest --cov=core` enforces
# locally. It has to be the one CI enforces (.github/workflows/tests.yml passes
# `--cov-fail-under` explicitly) or the local run is a weaker gate wearing the
# same name: this said 80 while CI said 95, so seventeen points of regression
# could pass on a laptop and only turn red on push.
#
# A ratchet, not a target: it sits a couple of points under the suite's real
# coverage so a genuine drop is visible. Raise it as coverage grows — in this
# file, in the workflow, and in the two places that quote it (CLAUDE.md, README
# § Testing) in the same commit. Never lower one to make a red build pass.
fail_under = 96
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]


# Mutation testing (dev-only, never in CI, never a declared dependency —
# `pip install mutmut` ad hoc). This section exists because mutmut cannot run in
# this repo without it, and the two non-obvious parts cost an afternoon to find:
# it copies the sources into ./mutants and runs there, so Django needs `config/`
# and `manage.py` copied along, and `frontend/public` too — the email service
# reads the inline logo from disk, and without it the baseline suite fails
# before a single mutant is generated. `also_copy` cannot name a nested file,
# only a directory or a top-level one.
#
# `only_mutate` is the per-run scope dial: mutating all of core/ is a
# multi-hour run nobody will wait for. Point it at what actually changed.
# Individual mutants can also be re-checked by name:
#   mutmut run core.utils.x_get_client_ip__mutmut_4
#
# Two traps that make a run lie without saying so:
#   - mutmut 3 SKIPS every function that has a decorator. A view written as
#     `@method_decorator(ratelimit(...)) def post(...)` is never mutated, so it
#     can never appear among the survivors: mutate those by hand.
#   - on macOS + Python 3.14 the children of its `fork` die with exit -11 unless
#     `no_proxy='*'` is exported; .claude/skills/solid-testing/scripts/mutation_test.sh
#     exports it and counts the segfaulted mutants in its summary (they were not
#     judged either way).
[tool.mutmut]
source_paths = ["core/"]
pytest_add_cli_args_test_selection = ["core/tests/"]
# Pointed at the hourly reservation engine and the collection a request
# resolves to, which is where the latest work was. An earlier scope — `serializers/booking.py`,
# `serializers/user.py`, `services/asset_cleanup.py`, whose field lists guard a
# privacy boundary and whose cleanup runs at delete time — came back clean and
# is kept here, commented out, rather than lost.
#
# **A survivor is a lead, not a verdict.** mutmut 3 runs only the tests its
# stats pass mapped to the mutated function, and that mapping misses tests
# which reach the code through the API: in one sweep, inverting
# `_readable_by` and making `resolve_request_collection` pick the collection it
# was NOT given both "survived", and both die against
# test_request_collection_privacy.py when applied by hand. Re-check a survivor
# that looks real before writing a test for it — and read one that is genuinely
# alive as "the tests that ran didn't kill it".
only_mutate = [
    "core/models/collection.py",
    "core/services/booking_service.py",
    # "core/serializers/booking.py",
    # "core/serializers/user.py",
    # "core/services/asset_cleanup.py",
]
# What the backend tests read from outside core/, copied into ./mutants:
#   - pytest.ini, manage.py, config/, conftest.py: Django and pytest start from
#     them.
#   - frontend/public: the email service reads the inline logo from disk.
#   - frontend/src: the parity tests read their shared JSON cases
#     (src/test/*Parity.json), the locales (every refusal code needs a string in
#     all three), the stylesheet (the palette test compares it with the seeded
#     colours) and utils/rental.js and the *.test.js files they mirror.
#   - frontend/index.html, frontend/package.json: read by the app code the
#     tests exercise (the SPA index and the link preview, the app palette).
# Without any of them the stats run fails before a single mutant is tried.
also_copy = [
    "pytest.ini",
    "manage.py",
    "config/",
    "conftest.py",
    "frontend/public",
    "frontend/src",
    "frontend/index.html",
    "frontend/package.json",
]
