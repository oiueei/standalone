# gitleaks configuration. Extends the built-in rules and allowlists known
# non-secret placeholder values used in CI and tests, so the secret scan in
# .github/workflows/tests.yml doesn't fail on them.
title = "OIUEEI gitleaks config"

[extend]
useDefault = true

# An operator's legal identity (name, tax ID, address) belongs in VITE_LEGAL_*
# config vars injected at build time, never in source. This fails the scan if a
# Spanish-style tax ID (8 digits + a letter) lands in frontend/src/legal/{ca,en,es}.js
# — a narrow tripwire scoped to those three files, inert where the legal text is
# generic.
[[rules]]
id = "oiueei-legal-identity-in-source"
description = "Operator tax ID hardcoded into src/legal/ instead of VITE_LEGAL_NIF"
regex = '''\b[0-9]{8}[A-Za-z]\b'''
path = '''frontend/src/legal/(?:ca|en|es)\.js$'''
tags = ["oiueei", "pii", "legal"]

[allowlist]
description = "Known non-secret test/CI placeholder values"
regexes = [
  '''test-secret-key-for-ci-only-not-for-production''',
  # A fake /share/{token} value used in frontend test fixtures
  # (smoke.test.jsx, and SharePage.test.jsx at commit 7b612ac before it was
  # swapped for a low-entropy stand-in). Not a real token — the share token is
  # generated per collection with secrets.token_urlsafe and never committed.
  '''aB3xK_9-pQrS2tUvWx1y''',
  # An object-storage key of an upload folder (`oiueei/things/…`, `/collections/…`, …),
  # as tests write them next to a `key` field. The generic-api-key rule reads the
  # assignment and the slash-separated word as a credential; it is a path inside the
  # public media bucket, not a secret. Bound to the folders uploads may write to.
  '''^oiueei/(?:things|collections|users|documents|seed)/[A-Za-z0-9_-]+$''',
]
